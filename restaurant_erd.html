<style>
  erd { padding: 1rem 0; }
  erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
  erd svg.erDiagram .row-rect-odd path,
  erd svg.erDiagram .row-rect-odd rect,
  erd svg.erDiagram .row-rect-even path,
  erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
  erd svg.erDiagram .node path:first-child {
    rx: 8;
    ry: 8;
  }
</style>
<div id="erd"></div>
<script type="module">
  import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  await document.fonts.ready;
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    fontFamily: '"anthropic-sans", sans-serif',
    themeVariables: {
      darkMode: dark,
      fontSize: '13px',
      fontFamily: '"anthropic-sans", sans-serif',
      lineColor: dark ? '#9c9a92' : '#73726c',
      textColor: dark ? '#c2c0b6' : '#3d3d3a',
    },
  });
  const diagram = `erDiagram
    CUSTOMERS ||--o{ ORDERS : places
    CUSTOMERS ||--o{ FEEDBACK : gives
    ORDERS ||--|{ ORDER_ITEMS : contains
    MENU_ITEMS ||--o{ ORDER_ITEMS : "ordered in"
    ORDERS ||--|| PAYMENTS : settles
    MENU_ITEMS ||--o{ INVENTORY : tracks
    STAFF ||--o{ ORDERS : "prepares/serves"
    RESTAURANTS ||--o{ MENU_ITEMS : offers
    RESTAURANTS ||--o{ STAFF : employs
    RESTAURANTS ||--o{ INVENTORY : manages
    
    CUSTOMERS {
      uuid customer_id PK
      string email UK
      string phone
      string name
      text preferences
      timestamp created_at
    }
    
    ORDERS {
      uuid order_id PK
      uuid customer_id FK
      uuid restaurant_id FK
      decimal total_amount
      string status "pending,preparing,ready,served,completed"
      timestamp ordered_at
      timestamp completed_at
    }
    
    ORDER_ITEMS {
      uuid order_item_id PK
      uuid order_id FK
      uuid menu_item_id FK
      int quantity
      decimal price_at_order
    }
    
    MENU_ITEMS {
      uuid menu_item_id PK
      uuid restaurant_id FK
      string name
      text description
      decimal price
      string category
      boolean available
    }
    
    PAYMENTS {
      uuid payment_id PK
      uuid order_id FK
      decimal amount
      string method "card,cash,mobile"
      string status "pending,completed,failed"
      timestamp paid_at
    }
    
    INVENTORY {
      uuid inventory_id PK
      uuid menu_item_id FK
      uuid restaurant_id FK
      int stock_quantity
      int reorder_level
      timestamp last_updated
    }
    
    STAFF {
      uuid staff_id PK
      uuid restaurant_id FK
      string name
      string role "chef,server,manager"
      string phone
      timestamp hired_date
    }
    
    FEEDBACK {
      uuid feedback_id PK
      uuid customer_id FK
      uuid order_id FK
      int rating "1-5"
      text comment
      timestamp created_at
    }
    
    RESTAURANTS {
      uuid restaurant_id PK
      string name
      string address
      string phone
      string cuisine_type
      decimal avg_rating
    }`;
  
  const { svg } = await mermaid.render('erd-svg', diagram);
  document.getElementById('erd').innerHTML = svg;
  
  document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
    const firstPath = node.querySelector('path[d]');
    if (!firstPath) return;
    const d = firstPath.getAttribute('d');
    const nums = d.match(/-?[\d.]+/g)?.map(Number);
    if (!nums || nums.length < 8) return;
    const xs = [nums[0], nums[2], nums[4], nums[6]];
    const ys = [nums[1], nums[3], nums[5], nums[7]];
    const x = Math.min(...xs), y = Math.min(...ys);
    const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', w);
    rect.setAttribute('height', h);
    rect.setAttribute('rx', '8');
    for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
      if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
    }
    firstPath.replaceWith(rect);
  });
  
  document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
    p.setAttribute('stroke', 'none');
  });
</script>
